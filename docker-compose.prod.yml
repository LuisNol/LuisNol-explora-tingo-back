services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: explore_tingo_app
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "ExploreTingo"
      APP_ENV: production
      APP_DEBUG: "0"
      APP_KEY: "base64:REEMPLAZA_CON_TU_APP_KEY_REAL"
      APP_URL: "https://tingo.turs.nlsumaranp.dev"

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: explore_tingo
      DB_USERNAME: laravel
      DB_PASSWORD: "REEMPLAZA_CON_TU_PASSWORD_REAL"

      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      SESSION_PATH: /
      SESSION_DOMAIN: ".nlsumaranp.dev"

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: public
      QUEUE_CONNECTION: redis

      CACHE_STORE: redis
      CACHE_PREFIX: explore_tingo

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379

      MAIL_MAILER: log
      MAIL_SCHEME: https
      MAIL_HOST: smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_FROM_ADDRESS: "hello@turs.nlsumaranp.dev"
      MAIL_FROM_NAME: "ExploreTingo"

      JWT_SECRET: "REEMPLAZA_CON_TU_JWT_SECRET_REAL"
      JWT_ALGO: HS256
      AUTH_GUARD: api

     # En vez de poner el código real, pon esto:
      GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: "https://tingo.turs.nlsumaranp.dev/api/auth/google/callback"
      GOOGLE_FRONTEND_URL: "https://turs.client.nlsumaranp.dev"

      SANCTUM_STATEFUL_DOMAINS: "turs.client.nlsumaranp.dev"
      SESSION_DOMAIN: ".nlsumaranp.dev"

      VIRTUAL_HOST: tingo.turs.nlsumaranp.dev
      LETSENCRYPT_HOST: tingo.turs.nlsumaranp.dev
      LETSENCRYPT_EMAIL: nolberto.sumaran@gmail.com


      VITE_APP_NAME: "ExploreTingo"
      RUN_MIGRATIONS: "true"
    volumes:
      - storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - explore_tingo_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: explore_tingo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: explore_tingo
      MYSQL_USER: laravel
      MYSQL_PASSWORD: "REEMPLAZA_CON_TU_PASSWORD_REAL"
      MYSQL_ROOT_PASSWORD: "REEMPLAZA_CON_TU_ROOT_PASSWORD_REAL"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explore_tingo_net

  redis:
    image: redis:7-alpine
    container_name: explore_tingo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explore_tingo_net

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: explore_tingo_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - explore_tingo_net

  acme-companion:
    image: nginxproxy/acme-companion:2
    container_name: explore_tingo_acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: tu-email@example.com
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - explore_tingo_net
    depends_on:
      - nginx-proxy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: explore_tingo_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: laravel
      PMA_PASSWORD: "REEMPLAZA_CON_TU_PASSWORD_REAL"
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - explore_tingo_net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage:
    driver: local
  conf:
  vhost:
  html:
  acme:

networks:
  explore_tingo_net:
    driver: bridge
